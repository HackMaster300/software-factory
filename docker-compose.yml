name: software-factory

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Runtime da factory (Next.js): SQLite em arquivo, zero deps — funciona sem Docker.
      # Para simulação real com SSMS, o serviço `mssql` abaixo sobe SQL Server 2022;
      # a factory continua em SQLite até `npm i mssql` + `lib/sql.ts` plugado no driver.
      SQLITE_PATH: /app/data/factory.db
      # Connection strings de exemplo (usadas quando o driver real for plugado):
      DATABASE_URL: postgresql://factory:factory@db:5432/factory
      MSSQL_CONNECTION_STRING: "Server=mssql,1433;Database=factory;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Factory123!};TrustServerCertificate=True;"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Factory123!}
    volumes:
      - appdata:/app/data
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped

  # SQL Server 2022 — para simulação real local com SSMS (Windows).
  # Imagem já em cache neste runner (mssql/server:2022-latest).
  # Schema T-SQL em db/schema-mssql.sql é aplicado automaticamente no primeiro start.
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Factory123!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
      - ./db/schema-mssql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Postgres 16 — mantido como alternativa (comente `mssql` acima e descomente abaixo para usar).
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: factory
  #     POSTGRES_PASSWORD: factory
  #     POSTGRES_DB: factory
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U factory -d factory"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   restart: unless-stopped

volumes:
  appdata:
  mssqldata:
  # pgdata:
